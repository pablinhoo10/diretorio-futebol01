<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diretório de Clubes de Futebol</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>⚽ Diretório de Clubes de Futebol</h1>
    <p>Gerencie equipes e estados conectados à nuvem e à BrasilAPI.</p>
  </header>

  <main class="container">
    <!-- Formulário do CRUD -->
    <section class="card">
      <h2 id="form-title">Cadastrar Novo Clube</h2>
      <form id="clube-form">
        <input type="hidden" id="clube-id">

        <label for="nome">Nome do Clube:</label>
        <input type="text" id="nome" required placeholder="Ex: Flamengo, Corinthians...">

        <label for="estado">Estado (UF):</label>
        <select id="estado" required>
          <option value="">Carregando estados da BrasilAPI...</option>
        </select>

        <label for="campeonato">Campeonato Principal:</label>
        <input type="text" id="campeonato" required placeholder="Ex: Brasileirão Série A">

        <div class="form-buttons">
          <button type="submit" id="btn-save">Salvar Clube</button>
          <button type="button" id="btn-cancel" style="display:none;">Cancelar</button>
        </div>
      </form>
    </section>

    <!-- Listagem do Firestore -->
    <section class="card">
      <h2>Clubes Cadastrados (Firestore)</h2>
      <div id="clubes-list" class="grid-clubes">
        <p>Carregando clubes do banco de dados...</p>
      </div>
    </section>
  </main>

  <!-- Scripts Modularizados -->
  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/api.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
